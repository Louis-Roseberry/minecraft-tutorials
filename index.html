<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft Tutorials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --noir: #000;
    --carte: #1c1c1c;
    --gris: #2a2a2a;
    --bord: #3b3b3b;
    --vert: #5fbf3b;
    --vert-fonce: #3a8a22;
    --vert-clair: #8fe06b;
    --texte: #ececec;
    --discret: #9b9b9b;
    --police-titre: "Pixelify Sans", "Courier New", monospace;
    --police-texte: "Barlow", system-ui, sans-serif;
  }

  * { box-sizing: border-box; border-radius: 0; scrollbar-color: var(--vert-fonce) #111; }

  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--noir);
    color: var(--texte);
    font-family: var(--police-texte);
    font-size: 1.05rem;
    line-height: 1.5;
  }

  a { color: inherit; }

  /* Header */
  .entete {
    flex: none;
    background: #141414;
    border-bottom: 4px solid var(--vert);
    padding: 14px 20px;
  }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-family: var(--police-titre);
    font-size: 1.4rem;
    text-decoration: none;
  }
  .cube {
    width: 24px;
    height: 24px;
    background: var(--vert);
    box-shadow: inset -4px -4px 0 var(--vert-fonce), inset 4px 4px 0 var(--vert-clair);
  }

  /* The main area scrolls on the home screen; fixed-height pages scroll only their list */
  #app {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .conteneur { width: 100%; max-width: 1120px; margin: 0 auto; padding: 32px 20px 72px; }
  .conteneur.page-fixe {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding-top: 20px;
    padding-bottom: 24px;
  }

  h1, h2 { font-family: var(--police-titre); font-weight: 600; line-height: 1.2; }
  h1 { font-size: 2.2rem; margin: 0 0 6px; }
  h2 { font-size: 1.2rem; color: var(--vert); margin: 0 0 10px; }
  .sous { color: var(--discret); margin: 0 0 28px; }

  /* Buttons */
  .btn {
    display: inline-block;
    padding: 12px 22px;
    background: var(--vert);
    border: 2px solid var(--noir);
    color: #000;
    font-family: var(--police-titre);
    font-size: 1.05rem;
    text-decoration: none;
    cursor: pointer;
    box-shadow: inset -3px -3px 0 var(--vert-fonce), inset 3px 3px 0 var(--vert-clair);
  }
  .btn:hover { background: #70d04b; }
  .btn:active { box-shadow: inset 3px 3px 0 var(--vert-fonce), inset -3px -3px 0 var(--vert-clair); }
  .btn.secondaire {
    background: var(--gris);
    color: var(--texte);
    box-shadow: inset -3px -3px 0 #141414, inset 3px 3px 0 #4d4d4d;
  }
  .btn.secondaire:hover { background: #333; outline: 2px solid var(--vert); }
  .btn:focus-visible, .carte:focus-visible, .retour:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 2px;
  }

  .retour {
    display: inline-block;
    margin-bottom: 16px;
    color: var(--discret);
    text-decoration: none;
  }
  .retour:hover { color: var(--vert); }

  /* Card grid */
  .grille {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 24px;
  }
  .vignette {
    background: conic-gradient(#202020 25%, #292929 0 50%, #202020 0 75%, #292929 0) 0 0 / 32px 32px;
  }
  .vignette img { display: block; width: 100%; height: 100%; object-fit: cover; }

  .carte {
    position: relative;
    display: block;
    aspect-ratio: 1;
    border: 2px solid var(--bord);
    overflow: hidden;
    text-decoration: none;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .carte .vignette { position: absolute; inset: 0; }
  .carte::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, .45);
    opacity: 0;
    transition: opacity .15s;
  }
  .carte-nom {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 1;
    padding: 36px 12px 12px;
    background: linear-gradient(transparent, rgba(0, 0, 0, .92));
    font-family: var(--police-titre);
    font-size: 1.1rem;
    line-height: 1.25;
  }
  .carte-btn {
    position: absolute;
    left: 50%; top: 42%;
    z-index: 2;
    transform: translate(-50%, -50%);
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s;
  }
  .carte:hover, .carte:focus-visible {
    transform: scale(1.07);
    z-index: 5;
    border-color: var(--vert);
    box-shadow: 6px 6px 0 var(--vert-fonce);
  }
  .carte:hover::after, .carte:focus-visible::after { opacity: 1; }
  .carte:hover .carte-btn, .carte:focus-visible .carte-btn { opacity: 1; }
  @media (hover: none) {
    .carte-btn { opacity: 1; top: 40%; }
    .carte::after { opacity: 1; background: rgba(0, 0, 0, .25); }
  }

  /* Tutorial screen: image, name and buttons stay in place, only the list scrolls */
  .detail {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
    grid-template-rows: minmax(0, 1fr);
    gap: 36px;
  }
  .detail-gauche { display: flex; flex-direction: column; gap: 18px; min-height: 0; }
  .detail-img { flex: 1; min-height: 120px; border: 2px solid var(--bord); overflow: hidden; }
  .detail-gauche h1 { flex: none; margin: 0; font-size: 2rem; }
  .actions { flex: none; display: flex; flex-wrap: wrap; gap: 14px; }
  .detail-droite { display: flex; flex-direction: column; min-height: 0; }
  .detail-droite h2 { flex: none; }

  @media (max-width: 760px) {
    .detail { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); gap: 18px; }
    .detail-img { flex: none; height: 26dvh; min-height: 100px; }
    .detail-gauche h1 { font-size: 1.5rem; }
    .actions .btn { padding: 10px 16px; }
    .conteneur { padding-left: 14px; padding-right: 14px; }
  }

  /* Material lists */
  .liste {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--carte);
    border: 2px solid var(--bord);
  }
  .liste.defilante { flex: 1; min-height: 0; overflow-y: auto; }
  .liste li { border-bottom: 2px solid var(--noir); }
  .liste li:last-child { border-bottom: 0; }
  .ligne {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 9px 12px;
  }
  .icone {
    flex: none;
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    background: #2d2d2d;
    border: 3px solid;
    border-color: #0f0f0f #5a5a5a #5a5a5a #0f0f0f;
  }
  .icone img {
    width: 32px;
    height: 32px;
    image-rendering: pixelated;
    opacity: 0;
    transition: opacity .2s;
  }
  .icone img.ok { opacity: 1; }
  .nom { flex: 1; min-width: 0; }
  .quantites { flex: none; margin-left: auto; text-align: right; }
  .qte { display: block; font-family: var(--police-titre); color: var(--vert); white-space: nowrap; }
  .repartition { display: block; color: var(--discret); font-size: .9rem; white-space: nowrap; }
  .vide { padding: 14px 12px; color: var(--discret); }
  .casse { display: none; }

  /* Checklist */
  .checklist-haut { flex: none; }
  .checklist-haut .sous { margin-bottom: 14px; }
  .explication { color: var(--discret); max-width: 70ch; margin: 0 0 16px; }
  .progression { margin: 0 0 18px; }
  .barre { height: 16px; background: var(--carte); border: 2px solid var(--bord); margin-top: 8px; }
  .barre i { display: block; height: 100%; width: 0; background: var(--vert); transition: width .2s; }
  .checklist-bas { flex: none; margin-top: 18px; }
  label.ligne { position: relative; cursor: pointer; }
  label.ligne:hover { background: #242424; }
  label.ligne input { position: absolute; opacity: 0; }
  .case {
    flex: none;
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    background: #0f0f0f;
    border: 2px solid #5a5a5a;
  }
  label.ligne input:checked + .case { background: var(--vert); border-color: var(--vert); }
  label.ligne input:checked + .case::after {
    content: "";
    width: 14px;
    height: 7px;
    border-left: 3px solid #000;
    border-bottom: 3px solid #000;
    transform: rotate(-45deg) translate(1px, -2px);
  }
  label.ligne input:focus-visible + .case { outline: 3px solid #fff; outline-offset: 2px; }
  label.ligne.coche .nom, label.ligne.coche .quantites { opacity: .45; }
  label.ligne.coche .nom { text-decoration: line-through; }
  .liste .qte { font-size: 1.15rem; }

  /* Completion popup */
  .voile {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(0, 0, 0, .78);
  }
  .popup {
    width: 100%;
    max-width: 440px;
    padding: 28px;
    background: var(--carte);
    border: 2px solid var(--vert);
    box-shadow: 8px 8px 0 var(--vert-fonce);
  }
  .popup h2 { color: var(--texte); font-size: 1.6rem; margin-bottom: 10px; }
  .popup p { margin: 0 0 22px; color: var(--discret); }

  /* Messages */
  .message {
    background: var(--carte);
    border: 2px solid var(--bord);
    border-left: 8px solid var(--vert);
    padding: 18px 20px;
    max-width: 70ch;
  }
  .message p { margin: 0 0 10px; }
  .message p:last-child { margin: 0; }
  .message code { background: #000; padding: 2px 6px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header class="entete">
  <a class="logo" href="#/"><span class="cube"></span>Minecraft Tutorials</a>
</header>

<main id="app"></main>

<script>
  const STACKS_PAR_SB = 27;
  const PILE_DEFAUT = 64;
  const CLE_STOCKAGE = 'mc-tutoriels-coches';

  const app = document.getElementById('app');
  const iconesWiki = new Map(); // wiki name -> image url (or null if not found)
  let tutoriels = [];

  /* ---------- Helpers ---------- */

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  const slug = s => String(s).toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  const urlSure = u => /^https?:\/\//i.test(u || '') ? u : '#';
  const nombre = n => Number(n).toLocaleString('en-US');
  const nomWiki = m => m.wiki || m.nom;

  // Converts a quantity into shulker boxes / stacks / items
  function repartition(quantite, pile = PILE_DEFAUT) {
    const parSb = pile * STACKS_PAR_SB;
    const sb = Math.floor(quantite / parSb);
    const stacks = Math.floor((quantite % parSb) / pile);
    const items = quantite % pile;
    const morceaux = [];
    if (sb) morceaux.push(`${sb} sb`);
    if (stacks) morceaux.push(`${stacks} ${stacks > 1 ? 'stacks' : 'stack'}`);
    if (items) morceaux.push(`${items} ${items > 1 ? 'items' : 'item'}`);
    return morceaux.join(', ') || '0';
  }

  /* ---------- Checked boxes (saved in the browser) ---------- */

  function lireCoches() {
    try { return JSON.parse(localStorage.getItem(CLE_STOCKAGE)) || {}; }
    catch { return {}; }
  }
  function ecrireCoches(obj) {
    try { localStorage.setItem(CLE_STOCKAGE, JSON.stringify(obj)); }
    catch { /* storage unavailable: checks won't be remembered */ }
  }

  /* ---------- Minecraft wiki icons (MediaWiki API) ---------- */

  async function chargerIcones() {
    const noms = [...new Set(tutoriels.flatMap(t =>
      t.materiaux.filter(m => !m.icone).map(nomWiki)
    ))];

    for (let i = 0; i < noms.length; i += 40) {
      const lot = noms.slice(i, i + 40);
      const titres = lot.map(n => `File:Invicon ${n}.png`).join('|');
      const url = 'https://minecraft.wiki/api.php?action=query&format=json&formatversion=2'
        + '&origin=*&prop=imageinfo&iiprop=url&titles=' + encodeURIComponent(titres);
      try {
        const reponse = await fetch(url);
        const donnees = await reponse.json();
        (donnees.query?.pages || []).forEach(p => {
          const nom = p.title.replace(/^File:Invicon /, '').replace(/\.png$/, '');
          iconesWiki.set(nom, p.imageinfo?.[0]?.url || null);
        });
      } catch {
        // The API didn't answer: try the direct file link instead
        lot.forEach(n => iconesWiki.set(n,
          'https://minecraft.wiki/w/Special:FilePath/Invicon_' + encodeURIComponent(n.replace(/ /g, '_')) + '.png'));
      }
    }
    appliquerIcones();
  }

  function appliquerIcones() {
    app.querySelectorAll('.icone').forEach(el => {
      const img = el.querySelector('img');
      const url = el.dataset.src || iconesWiki.get(el.dataset.wiki);
      if (url && img.getAttribute('src') !== url) img.src = url;
    });
  }

  const iconeHtml = m => `<span class="icone" data-wiki="${esc(nomWiki(m))}"${m.icone ? ` data-src="${esc(m.icone)}"` : ''}><img alt=""></span>`;

  // An image that fails to load is hidden (the tile pattern stays visible)
  document.addEventListener('error', e => {
    if (e.target.tagName === 'IMG') e.target.classList.add('casse');
  }, true);
  document.addEventListener('load', e => {
    if (e.target.tagName === 'IMG') e.target.classList.add('ok');
  }, true);

  /* ---------- Screens ---------- */

  function vueAccueil() {
    const n = tutoriels.length;
    app.innerHTML = `
      <section class="conteneur">
        <h1>Tutorials</h1>
        <p class="sous">${n} ${n === 1 ? 'tutorial' : 'tutorials'} available</p>
        <div class="grille">
          ${tutoriels.map(t => `
            <a class="carte" href="#/tuto/${encodeURIComponent(t.id)}">
              <div class="vignette">${t.image ? `<img src="${esc(t.image)}" alt="">` : ''}</div>
              <div class="carte-nom">${esc(t.titre)}</div>
              <span class="btn carte-btn">Start</span>
            </a>`).join('')}
        </div>
      </section>`;
  }

  function vueDetail(t) {
    const lignes = t.materiaux.map(m => {
      const pile = m.pile || PILE_DEFAUT;
      return `
        <li>
          <div class="ligne">
            ${iconeHtml(m)}
            <span class="nom">${esc(m.nom)}</span>
            <span class="quantites">
              <span class="qte">×${nombre(m.quantite)}</span>
              ${m.quantite >= pile ? `<span class="repartition">${repartition(m.quantite, pile)}</span>` : ''}
            </span>
          </div>
        </li>`;
    }).join('');

    app.innerHTML = `
      <section class="conteneur page-fixe">
        <a class="retour" href="#/">← Back to tutorials</a>
        <div class="detail">
          <div class="detail-gauche">
            <div class="detail-img vignette">${t.image ? `<img src="${esc(t.image)}" alt="${esc(t.titre)}">` : ''}</div>
            <h1>${esc(t.titre)}</h1>
            <div class="actions">
              <a class="btn" href="${esc(urlSure(t.lien))}" target="_blank" rel="noopener">Watch on YouTube</a>
              <a class="btn secondaire" href="#/materiaux/${encodeURIComponent(t.id)}">Checklist</a>
            </div>
          </div>
          <div class="detail-droite">
            <h2>Materials</h2>
            <ul class="liste defilante">${lignes || '<li class="vide">No materials listed.</li>'}</ul>
          </div>
        </div>
      </section>`;
  }

  function vueMateriaux(t) {
    const coches = lireCoches()[t.id] || {};
    const lignes = t.materiaux.map(m => {
      const pile = m.pile || PILE_DEFAUT;
      const coche = !!coches[m.nom];
      return `
        <li>
          <label class="ligne${coche ? ' coche' : ''}">
            <input type="checkbox" data-nom="${esc(m.nom)}"${coche ? ' checked' : ''}>
            <span class="case"></span>
            ${iconeHtml(m)}
            <span class="nom">${esc(m.nom)}</span>
            <span class="quantites">
              <span class="qte">${repartition(m.quantite, pile)}</span>
              <span class="repartition">${nombre(m.quantite)} total</span>
            </span>
          </label>
        </li>`;
    }).join('');

    app.innerHTML = `
      <section class="conteneur page-fixe" data-tuto="${esc(t.id)}">
        <div class="checklist-haut">
          <a class="retour" href="#/tuto/${encodeURIComponent(t.id)}">← Back to tutorial</a>
          <h1>Checklist</h1>
          <p class="sous">${esc(t.titre)}</p>
          <p class="explication">1 stack = 64 items (16 or 1 for some items) and 1 sb (shulker box) = 27 stacks. Check each material off as you gather it.</p>
          <div class="progression">
            <span class="progression-texte"></span>
            <div class="barre"><i></i></div>
          </div>
        </div>
        <ul class="liste defilante">${lignes || '<li class="vide">No materials listed.</li>'}</ul>
        <div class="checklist-bas">
          <button class="btn secondaire" id="tout-decocher" type="button">Uncheck all</button>
        </div>
      </section>`;

    majProgression(app.querySelector('[data-tuto]'));

    document.getElementById('tout-decocher').addEventListener('click', () => {
      const tous = lireCoches();
      delete tous[t.id];
      ecrireCoches(tous);
      vueMateriaux(t);
      appliquerIcones();
    });
  }

  function vueIntrouvable() {
    app.innerHTML = `
      <section class="conteneur">
        <div class="message">
          <p>This tutorial doesn't exist or has been removed.</p>
          <p><a href="#/">Back to the tutorial list</a></p>
        </div>
      </section>`;
  }

  function vueErreur() {
    app.innerHTML = `
      <section class="conteneur">
        <div class="message">
          <p>Couldn't load <code>tutoriels.json</code>.</p>
          <p>If you opened <code>index.html</code> directly from your computer, the browser blocks reading the JSON file. Start a small local server in the site folder (for example <code>python -m http.server</code>, then open <code>http://localhost:8000</code>), or put the site online.</p>
          <p>Also check that the JSON file has no syntax error (a missing or extra comma).</p>
        </div>
      </section>`;
  }

  /* ---------- Progress and completion popup ---------- */

  function majProgression(conteneur) {
    const cases = [...conteneur.querySelectorAll('input[data-nom]')];
    const n = cases.filter(c => c.checked).length;
    conteneur.querySelector('.progression-texte').textContent =
      `${n} of ${cases.length} ${cases.length === 1 ? 'material' : 'materials'} collected`;
    conteneur.querySelector('.barre i').style.width = (cases.length ? (n / cases.length) * 100 : 0) + '%';
    return { n, total: cases.length };
  }

  function fermerPopup() {
    document.getElementById('popup')?.remove();
  }

  function ouvrirPopup(t) {
    fermerPopup();
    const voile = document.createElement('div');
    voile.className = 'voile';
    voile.id = 'popup';
    voile.innerHTML = `
      <div class="popup" role="dialog" aria-modal="true" aria-labelledby="popup-titre">
        <h2 id="popup-titre">All materials collected</h2>
        <p>You have everything you need for ${esc(t.titre)}.</p>
        <a class="btn" id="popup-suivant" href="#/tuto/${encodeURIComponent(t.id)}">Next</a>
      </div>`;
    document.body.appendChild(voile);
    voile.addEventListener('click', e => {
      if (e.target === voile || e.target.id === 'popup-suivant') fermerPopup();
    });
    document.getElementById('popup-suivant').focus();
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') fermerPopup(); });

  app.addEventListener('change', e => {
    const c = e.target;
    if (!c.matches('input[data-nom]')) return;
    const conteneur = c.closest('[data-tuto]');
    const id = conteneur.dataset.tuto;
    const tous = lireCoches();
    const actuel = tous[id] || {};
    if (c.checked) actuel[c.dataset.nom] = true; else delete actuel[c.dataset.nom];
    tous[id] = actuel;
    ecrireCoches(tous);
    c.closest('label').classList.toggle('coche', c.checked);
    const { n, total } = majProgression(conteneur);
    if (c.checked && total > 0 && n === total) {
      ouvrirPopup(tutoriels.find(x => x.id === id));
    }
  });

  /* ---------- Navigation ---------- */

  function route() {
    fermerPopup();
    const [, page, idBrut] = location.hash.split('/');
    const id = idBrut ? decodeURIComponent(idBrut) : '';
    const t = tutoriels.find(x => x.id === id);

    if (page === 'tuto' && t) vueDetail(t);
    else if (page === 'materiaux' && t) vueMateriaux(t);
    else if (page === 'tuto' || page === 'materiaux') vueIntrouvable();
    else vueAccueil();

    appliquerIcones();
    app.scrollTo(0, 0);
  }

  /* ---------- Start ---------- */

  async function demarrer() {
    try {
      const reponse = await fetch('tutoriels.json');
      if (!reponse.ok) throw new Error(reponse.status);
      const donnees = await reponse.json();
      const liste = Array.isArray(donnees) ? donnees : donnees.tutoriels;
      tutoriels = liste.map(t => ({
        ...t,
        id: t.id || slug(t.titre),
        materiaux: t.materiaux || []
      }));
    } catch (erreur) {
      vueErreur();
      return;
    }
